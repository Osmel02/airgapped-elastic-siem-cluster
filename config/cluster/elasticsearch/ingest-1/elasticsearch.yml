cluster.name: soc
node.name: ingest-1
node.roles: [ ingest ]

path.data: /mnt/elasticsearch
path.logs: /var/log/elasticsearch

network.host: ingest-1.soc.com
network.bind_host: ingest-1.soc.com
network.publish_host: ingest-1.soc.com
transport.port: 9300
http.port: 9200

discovery.seed_hosts:
  - master-1.soc.com
  - master-2.soc.com
  - master-3.soc.com

xpack.security.enabled: true
xpack.security.authc.api_key.enabled: true
xpack.security.enrollment.enabled: true

xpack.security.transport.ssl:
  enabled: true
  verification_mode: certificate
  keystore.path: /etc/elasticsearch/certs/ingest-1/ingest-1.p12
  truststore.path: /etc/elasticsearch/certs/ingest-1/ingest-1.p12

xpack.security.http.ssl:
  enabled: true
  keystore.path: /etc/elasticsearch/certs/ingest-1/ingest-1.p12
  truststore.path: /etc/elasticsearch/certs/ingest-1/ingest-1.p12
  verification_mode: certificate

indices.query.bool.max_clause_count: 10000